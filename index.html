<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burdy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="gameWrapper">

        <div id="game">

            <!-- SKY CLOUDS (decorative only, no effect on gameplay) -->
            <div class="clouds" aria-hidden="true">
                <div class="cloud cloud--a cloud1"></div>
                <div class="cloud cloud--b cloud2"></div>
                <div class="cloud cloud--c cloud3"></div>
                <div class="cloud cloud--a cloud4"></div>
                <div class="cloud cloud--b cloud5"></div>
            </div>

            <!-- CAMERA SCREEN -->
            <div id="cameraScreen">

                <div class="brand">
                    <span class="brandEmoji">🐦</span>
                    <h1>Burdy</h1>
                </div>

                <p>Snap a selfie to become the bird!</p>

                <div class="cameraFrame">
                    <video id="camera" autoplay playsinline></video>
                    <img id="photoPreview" alt="Your photo">
                </div>

                <canvas id="photoCanvas"></canvas>

                <button id="takePhotoButton" class="btn btn--primary">📸 Take Photo</button>

                <button id="retakeButton" class="btn btn--ghost">🔄 Retake</button>

                <div id="nameSection">

                    <input
                        type="text"
                        id="playerName"
                        placeholder="Enter your name"
                        maxlength="15"
                        autocomplete="off"
                    >

                    <button id="startButton" class="btn btn--primary">Start Game</button>

                </div>

                <p id="cameraError"></p>

            </div>


            <!-- GAME -->
            <div id="bird">
                <img id="birdImage" alt="Player">
            </div>

            <div id="score">0</div>


            <!-- LEADERBOARD -->
            <div id="leaderboardScreen">

                <h1>🏆 Leaderboard</h1>

                <div id="leaderboardList"></div>

                <button id="backButton" class="btn btn--primary">Back</button>

            </div>

        </div>

    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
